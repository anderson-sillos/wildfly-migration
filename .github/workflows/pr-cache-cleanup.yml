name: pr-cache-cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  delete-pr-caches:
    name: delete-pr-caches
    if: >-
      github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete caches scoped to the closed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          gh cache delete --all \
            --ref "$PR_CACHE_REF" \
            --succeed-on-no-caches
