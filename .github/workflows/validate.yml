name: repository-baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/doctor.sh
          bash -n scripts/validate-cp-1b.sh
          bash -n scripts/audit-legacy-war.sh
          bash -n scripts/build-cp-1c.sh
          bash -n scripts/validate-cp-1c.sh
          bash -n scripts/validate-cp-1d-selection.sh
          bash -n scripts/validate-cp-1d-profiles.sh
          bash -n scripts/validate-cp-1d-h2.sh
          bash -n scripts/validate-cp-1d-datasources.sh
          bash -n scripts/build-cp-1d.sh
          bash -n scripts/smoke-wildfly9-datasource.sh
          bash -n scripts/follow-wildfly9-log.sh
          bash -n scripts/oracle-lab-schema.sh
          bash -n scripts/validate-documentation.sh
          bash -n scripts/validate-cp-1e-persistence.sh
          bash -n scripts/validate-cp-1e-web.sh
          bash -n scripts/validate-cp-1f-upload.sh
          bash -n scripts/validate-cp-1f-xml.sh
          bash -n scripts/validate-cp-1f-discovery-logging.sh
          bash -n scripts/validate-cp-1f-contracts.sh
          bash -n scripts/validate-cp-1g-baseline.sh
          bash -n scripts/build-cp-2a.sh
          bash -n scripts/validate-cp-2a.sh
          bash -n contract-tests/run.sh

      - name: Validate repository baseline
        run: ./scripts/doctor.sh CP-1A --ci

      - name: Validate CP-1B static resources
        run: ./scripts/validate-cp-1b.sh --release

      - name: Validate CP-1C static resources
        run: ./scripts/validate-cp-1c.sh

      - name: Validate CP-1D runtime selection
        run: ./scripts/validate-cp-1d-selection.sh

      - name: Validate CP-1D profiles and guards
        run: ./scripts/validate-cp-1d-profiles.sh

      - name: Validate CP-1D H2 scripts statically
        run: ./scripts/validate-cp-1d-h2.sh

      - name: Validate CP-1D datasource profiles
        run: ./scripts/validate-cp-1d-datasources.sh

      - name: Validate CP-1E persistence statically
        run: ./scripts/validate-cp-1e-persistence.sh

      - name: Validate CP-1E web layer statically
        run: ./scripts/validate-cp-1e-web.sh

      - name: Validate consolidated documentation
        run: ./scripts/validate-documentation.sh

      - name: Validate CP-1F legacy upload statically
        run: ./scripts/validate-cp-1f-upload.sh

      - name: Validate CP-1F legacy XML import statically
        run: ./scripts/validate-cp-1f-xml.sh

      - name: Validate CP-1F Reflections and Log4j statically
        run: ./scripts/validate-cp-1f-discovery-logging.sh

      - name: Validate CP-1F external contracts statically
        run: ./scripts/validate-cp-1f-contracts.sh

      - name: Validate CP-1G frozen baseline statically
        run: ./scripts/validate-cp-1g-baseline.sh

      - name: Validate CP-2A Java 8 transition statically
        run: ./scripts/validate-cp-2a.sh

  portable-ci:
    name: portable-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify fixed portable runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/wildfly-migration-cp2a"
          archives="$runtime_root/archives"
          tools="$runtime_root/tools"
          install -d -m 0755 "$archives" "$tools"

          curl -fsSLo "$archives/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz" \
            https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u492-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz
          curl -fsSLo "$archives/apache-maven-3.8.9-bin.tar.gz" \
            https://archive.apache.org/dist/maven/maven-3/3.8.9/binaries/apache-maven-3.8.9-bin.tar.gz
          curl -fsSLo "$archives/wildfly-9.0.2.Final.tar.gz" \
            https://download.jboss.org/wildfly/9.0.2.Final/wildfly-9.0.2.Final.tar.gz
          curl -fsSLo "$archives/h2-1.4.200.jar" \
            https://repo.maven.apache.org/maven2/com/h2database/h2/1.4.200/h2-1.4.200.jar

          cd "$archives"
          sha256sum --check <<'CHECKSUMS'
          da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e  OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz
          3e4c68cdd70f96635e713f36c8fc3ea3182035245d3da2156576710ca0fe4b0c  apache-maven-3.8.9-bin.tar.gz
          74689569d6e04402abb7d94921c558940725d8065dce21a2d7194fa354249bb6  wildfly-9.0.2.Final.tar.gz
          3ad9ac4b6aae9cd9d3ac1c447465e1ed06019b851b893dd6a8d76ddb6d85bca6  h2-1.4.200.jar
          CHECKSUMS

          tar -xzf OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz -C "$tools"
          tar -xzf apache-maven-3.8.9-bin.tar.gz -C "$tools"
          tar -xzf wildfly-9.0.2.Final.tar.gz -C "$tools"

          {
            echo "MIGRATION_CHECKPOINT=CP-2A"
            echo "LAB_BIND_ADDRESS=127.0.0.1"
            echo "WILDFLY_HTTP_PORT=18080"
            echo "WILDFLY_MANAGEMENT_PORT=19990"
            echo "JAVA8_HOME=$tools/jdk8u492-b09"
            echo "JAVA8_ARCHIVE=$archives/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz"
            echo "JAVA8_ARCHIVE_SHA256=da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e"
            echo "MAVEN_HOME=$tools/apache-maven-3.8.9"
            echo "MAVEN_ARCHIVE=$archives/apache-maven-3.8.9-bin.tar.gz"
            echo "MAVEN_ARCHIVE_SHA256=3e4c68cdd70f96635e713f36c8fc3ea3182035245d3da2156576710ca0fe4b0c"
            echo "WILDFLY9_HOME=$tools/wildfly-9.0.2.Final"
            echo "WILDFLY9_ARCHIVE=$archives/wildfly-9.0.2.Final.tar.gz"
            echo "WILDFLY9_ARCHIVE_SHA256=74689569d6e04402abb7d94921c558940725d8065dce21a2d7194fa354249bb6"
            echo "H2_JAR=$archives/h2-1.4.200.jar"
            echo "H2_SHA256=3ad9ac4b6aae9cd9d3ac1c447465e1ed06019b851b893dd6a8d76ddb6d85bca6"
          } >> "$GITHUB_ENV"

      - name: Run portable doctor
        run: ./scripts/doctor.sh CP-2A --profile ci-h2 --ci

      - name: Build and audit portable WAR
        run: ./scripts/build-cp-2a.sh --profile ci-h2

      - name: Execute MyBatis portable persistence probe
        run: |
          ./scripts/validate-cp-1e-persistence.sh \
            --java-home "$JAVA8_HOME" \
            --h2-jar "$H2_JAR"

      - name: Execute H2 schema lifecycle
        run: |
          ./scripts/validate-cp-1d-h2.sh \
            --java-home "$JAVA8_HOME" \
            --h2-jar "$H2_JAR"

      - name: Smoke WildFly 9 H2 datasource
        run: |
          ./scripts/smoke-wildfly9-datasource.sh \
            --java 8 \
            --profile ci-h2 \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-2a-ci-h2.json

      - name: Compare portable result with the frozen baseline
        run: |
          ./scripts/validate-cp-2a.sh \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-2a-ci-h2.json

      - name: Upload sanitized portable contract result
        uses: actions/upload-artifact@v4
        with:
          name: cp-2a-portable-contract-result
          path: app/target/contract-results/cp-2a-ci-h2.json
          if-no-files-found: error
