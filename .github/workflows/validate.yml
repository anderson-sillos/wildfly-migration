name: repository-baseline

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: |
          bash -n scripts/doctor.sh
          bash -n scripts/validate-cp-1b.sh
          bash -n scripts/audit-legacy-war.sh
          bash -n scripts/build-cp-1c.sh
          bash -n scripts/validate-cp-1c.sh
          bash -n scripts/validate-cp-1d-selection.sh
          bash -n scripts/validate-cp-1d-profiles.sh
          bash -n scripts/validate-cp-1d-h2.sh
          bash -n scripts/validate-cp-1d-datasources.sh
          bash -n scripts/build-cp-1d.sh
          bash -n scripts/smoke-wildfly9-datasource.sh
          bash -n scripts/follow-wildfly9-log.sh
          bash -n scripts/oracle-lab-schema.sh
          bash -n scripts/validate-documentation.sh
          bash -n scripts/validate-cp-1e-persistence.sh
          bash -n scripts/validate-cp-1e-web.sh
          bash -n scripts/validate-cp-1f-upload.sh
          bash -n scripts/validate-cp-1f-xml.sh
          bash -n scripts/validate-cp-1f-discovery-logging.sh
          bash -n scripts/validate-cp-1f-contracts.sh
          bash -n scripts/validate-cp-1g-baseline.sh
          bash -n scripts/build-cp-2a.sh
          bash -n scripts/validate-cp-2a.sh
          bash -n scripts/smoke-wildfly26-datasource.sh
          bash -n scripts/validate-cp-2b.sh
          bash -n contract-tests/run.sh

      - name: Validate repository baseline
        run: ./scripts/doctor.sh CP-1A --ci

      - name: Validate CP-1B static resources
        run: ./scripts/validate-cp-1b.sh --release

      - name: Validate CP-1C static resources
        run: ./scripts/validate-cp-1c.sh

      - name: Validate CP-1D runtime selection
        run: ./scripts/validate-cp-1d-selection.sh

      - name: Validate CP-1D profiles and guards
        run: ./scripts/validate-cp-1d-profiles.sh

      - name: Validate CP-1D H2 scripts statically
        run: ./scripts/validate-cp-1d-h2.sh

      - name: Validate CP-1D datasource profiles
        run: ./scripts/validate-cp-1d-datasources.sh

      - name: Validate CP-1E persistence statically
        run: ./scripts/validate-cp-1e-persistence.sh

      - name: Validate CP-1E web layer statically
        run: ./scripts/validate-cp-1e-web.sh

      - name: Validate consolidated documentation
        run: ./scripts/validate-documentation.sh

      - name: Validate CP-1F legacy upload statically
        run: ./scripts/validate-cp-1f-upload.sh

      - name: Validate CP-1F legacy XML import statically
        run: ./scripts/validate-cp-1f-xml.sh

      - name: Validate CP-1F Reflections and Log4j statically
        run: ./scripts/validate-cp-1f-discovery-logging.sh

      - name: Validate CP-1F external contracts statically
        run: ./scripts/validate-cp-1f-contracts.sh

      - name: Validate CP-1G frozen baseline statically
        run: ./scripts/validate-cp-1g-baseline.sh

      - name: Validate CP-2A Java 8 transition statically
        run: ./scripts/validate-cp-2a.sh

      - name: Validate CP-2B WildFly 26 transition statically
        run: ./scripts/validate-cp-2b.sh
