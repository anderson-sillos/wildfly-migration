name: validation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the same repository baseline used locally
        run: ./scripts/validate-repository-baseline.sh

      - name: Validate incompatibility catalog
        run: ./scripts/validate-incompatibility-catalog.sh

      - name: Validate CP-3K clean reproduction evidence
        run: ./scripts/validate-cp-3k-reproduction.sh --profile ci-h2

      - name: Validate CP-3K audit evidence
        run: ./scripts/validate-cp-3k-audit.sh

  portable-ci:
    name: portable-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATION_SOURCE_COMMIT: >-
        ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select portable validation depth
        id: portable-selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" &&
                "$EVENT_ACTION" == "synchronize" ]]; then
            comparison_base="$BEFORE_SHA"
            comparison_head="$AFTER_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            comparison_base="$PR_BASE_SHA"
            comparison_head="$PR_HEAD_SHA"
          else
            comparison_base="$BEFORE_SHA"
            comparison_head="$AFTER_SHA"
          fi

          git diff --name-only --no-renames \
            "$comparison_base" "$comparison_head" -- || true

          run_portable=true
          reason="runtime-impacting-path"
          if git cat-file -e "${comparison_base}^{commit}" 2>/dev/null &&
             git cat-file -e "${comparison_head}^{commit}" 2>/dev/null &&
             git diff --quiet --no-renames \
               "$comparison_base" "$comparison_head" -- \
               . \
               ':(exclude,glob)*.md' \
               ':(exclude,glob)**/*.md' \
               ':(exclude,glob)docs/**' \
               ':(exclude,glob)openspec/**' \
               ':(exclude,glob)migration/evidence/**' \
               ':(exclude,glob)migration/steps/**' \
               ':(exclude)migration/incompatibilities.tsv' \
               ':(exclude)scripts/validate-documentation.sh'; then
            previous_success=true
            if [[ "$EVENT_NAME" == "pull_request" &&
                  "$EVENT_ACTION" == "synchronize" ]]; then
              previous_success=false
              if result="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/commits/$BEFORE_SHA/check-runs" \
                  --jq 'any(.check_runs[]; .name == "portable-ci" and .conclusion == "success")'
              )" && [[ "$result" == "true" ]]; then
                previous_success=true
              fi
            fi

            if [[ "$previous_success" == "true" ]]; then
              run_portable=false
              reason="documentation-or-planning-only"
            else
              reason="previous-head-without-successful-portable-check"
            fi
          fi

          mode="cp3b"
          if [[ "$run_portable" == "true" ]] &&
             grep -Fq 'https://jakarta.ee/xml/ns/jakartaee' \
               app/src/main/webapp/WEB-INF/web.xml; then
            mode="cp3f"
          fi

          echo "run=$run_portable" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "portable-ci completo: $run_portable ($reason; $mode)"

      - name: Keep the portable check lightweight
        if: steps.portable-selection.outputs.run != 'true'
        run: >-
          echo "Alteração sem impacto no runtime e revisão anterior aprovada;
          repository-baseline cobre a validação documental."

      - name: Restore reusable runtime archive cache
        id: runtime-archive-cache
        if: steps.portable-selection.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/wildfly-migration-cache/runtime-archives
          key: runtime-archives-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/portable-runtime-cache.sha256') }}
          restore-keys: |
            runtime-archives-v4-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore reusable Maven dependency cache
        id: maven-dependency-cache
        if: steps.portable-selection.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-repository-v3-${{ runner.os }}-${{ runner.arch }}-maven-3.9.16-${{ hashFiles('app/pom.xml') }}
          restore-keys: |
            maven-repository-v3-${{ runner.os }}-${{ runner.arch }}-maven-3.9.16-

      - name: Download and verify fixed portable runtime
        if: steps.portable-selection.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/wildfly-migration-cp3b"
          archives="$RUNNER_TEMP/wildfly-migration-cache/runtime-archives"
          cache_lock="$GITHUB_WORKSPACE/runtime/portable-runtime-cache.sha256"
          runtime_sources="$GITHUB_WORKSPACE/runtime/portable-runtime-sources.tsv"
          tools="$runtime_root/tools"
          install -d -m 0755 "$archives" "$tools"

          ./scripts/prepare-portable-runtime-cache.sh \
            --archives-dir "$archives" \
            --lock "$cache_lock" \
            --sources "$runtime_sources"

          cd "$archives"

          tar -xzf OpenJDK17U-jdk_x64_linux_hotspot_17.0.20_8.tar.gz -C "$tools"
          tar -xzf OpenJDK21U-jdk_x64_linux_hotspot_21.0.12_8.tar.gz -C "$tools"
          tar -xzf OpenJDK25U-jdk_x64_linux_hotspot_25.0.4_7.tar.gz -C "$tools"
          tar -xzf apache-maven-3.9.16-bin.tar.gz -C "$tools"
          tar -xzf wildfly-26.1.3.Final.tar.gz -C "$tools"
          tar -xzf wildfly-41.0.0.Final.tar.gz -C "$tools"

          {
            echo "MIGRATION_CHECKPOINT=CP-3B"
            echo "LAB_BIND_ADDRESS=127.0.0.1"
            echo "WILDFLY_HTTP_PORT=18080"
            echo "WILDFLY_MANAGEMENT_PORT=19990"
            echo "JAVA17_HOME=$tools/jdk-17.0.20+8"
            echo "JAVA17_ARCHIVE=$archives/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20_8.tar.gz"
            echo "JAVA17_ARCHIVE_SHA256=be7668bc030d578b83d6d5ef9221d6d6729bbbca8cf94a7d52e16ac68b5a5a35"
            echo "MAVEN_HOME=$tools/apache-maven-3.9.16"
            echo "MAVEN_ARCHIVE=$archives/apache-maven-3.9.16-bin.tar.gz"
            echo "MAVEN_ARCHIVE_SHA256=80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb"
            echo "WILDFLY26_HOME=$tools/wildfly-26.1.3.Final"
            echo "WILDFLY26_ARCHIVE=$archives/wildfly-26.1.3.Final.tar.gz"
            echo "WILDFLY26_ARCHIVE_SHA256=aadd317c62616f6b5735ae92151d06c1f03c46eba448958d982c61f02528ae59"
            echo "JAVA21_HOME=$tools/jdk-21.0.12+8"
            echo "JAVA21_ARCHIVE=$archives/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12_8.tar.gz"
            echo "JAVA21_ARCHIVE_SHA256=e4446ff06a276155697597cc0f1b15da004ff083f4964a35271ecee567177370"
            echo "JAVA25_HOME=$tools/jdk-25.0.4+7"
            echo "JAVA25_ARCHIVE=$archives/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4_7.tar.gz"
            echo "JAVA25_ARCHIVE_SHA256=e58fcdcd637b25c03ca84cbbcefc70d11efb8f4b4cbd05decc9f661769d77f94"
            echo "WILDFLY41_HOME=$tools/wildfly-41.0.0.Final"
            echo "WILDFLY41_ARCHIVE=$archives/wildfly-41.0.0.Final.tar.gz"
            echo "WILDFLY41_ARCHIVE_SHA256=d240795958e7d99b638cd4c3e0f9ba4b7d4c53b4f7996dfec1008250c4d48191"
            echo "H2_JAR=$archives/h2-2.4.240.jar"
            echo "H2_SHA256=29b70e427cc1c40cdc376283adbb0cc62853073797bb5fe5761f81fe73d57ce0"
          } >> "$GITHUB_ENV"

      - name: Build and validate CP-3F Jakarta
        if: steps.portable-selection.outputs.mode == 'cp3f'
        run: |
          ./scripts/doctor.sh CP-3F --profile ci-h2 --ci
          ./scripts/build-cp-3f-jakarta.sh \
            --env /dev/null
          ./scripts/validate-cp-3f-namespace.sh

      - name: Execute CP-3G layout smoke on WildFly 41
        if: steps.portable-selection.outputs.mode == 'cp3f'
        run: |
          ./scripts/doctor.sh CP-3G --profile ci-h2 --ci
          ./scripts/validate-cp-3g-tiles.sh
          ./scripts/validate-cp-3g-upload.sh
          ./scripts/smoke-wildfly41-datasource.sh \
            --profile ci-h2 \
            --env /dev/null \
            --war app/target/cp3f-jakarta11/wildfly-migration.war \
            --result app/target/contract-results/cp-3f-ci-h2.json \
            --diagnostic-log app/target/contract-results/cp-3f-wildfly41.log
          ./scripts/validate-cp-3g-discovery.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/validate-cp-3g-logging.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war \
            --server-log app/target/contract-results/cp-3f-wildfly41.log
          ./scripts/validate-cp-3g-closure.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war

      - name: Execute CP-3H XML compatibility gate
        if: steps.portable-selection.outputs.mode == 'cp3f'
        run: |
          ./scripts/doctor.sh CP-3H --profile ci-h2 --ci
          ./scripts/validate-cp-3h-xml.sh \
            --env /dev/null \
            --execute --skip-build \
            --war app/target/cp3f-jakarta11/wildfly-migration.war

      - name: Validate CP-3H datasource provisioning
        if: steps.portable-selection.outputs.mode == 'cp3f'
        run: |
          ./scripts/validate-cp-3h-datasource.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/validate-cp-3h-oracle-qualification.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/audit-cp-3h-final-packaging.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/validate-cp-3h-closure.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/qualify-cp-3i-persistence.sh \
            --profile ci-h2 \
            --env /dev/null \
            --war app/target/cp3f-jakarta11/wildfly-migration.war \
            --result migration/evidence/CP-3I/persistence-ci-h2.json
          ./scripts/validate-cp-3i-persistence.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/qualify-cp-3i-contracts.sh \
            --profile ci-h2 \
            --env /dev/null \
            --war app/target/cp3f-jakarta11/wildfly-migration.war \
            --result migration/evidence/CP-3I/contract-ci-h2.json \
            --diagnostic-log app/target/contract-results/cp3i-3.42-ci-h2-server.log
          ./scripts/validate-cp-3i-contracts.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/generate-cp-3i-manifest.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war \
            --output migration/evidence/CP-3I/manifest.properties
          ./scripts/validate-cp-3i-manifest.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/validate-cp-3i-java17-runbook.sh
          ./scripts/validate-cp-3i-closure.sh \
            --war app/target/cp3f-jakarta11/wildfly-migration.war
          ./scripts/validate-cp-3j-runtime-selection.sh

      - name: Execute CP-3J Java 25 correction
        if: steps.portable-selection.outputs.mode == 'cp3f'
        run: |
          ./scripts/doctor.sh CP-3J --profile ci-h2 --ci
          ./scripts/build-cp-3j-java25.sh \
            --env /dev/null \
            --result migration/evidence/CP-3J/java25-build.json \
            --output migration/evidence/CP-3J/java25-build.txt
          ./scripts/validate-cp-3j-java25.sh

      - name: Execute CP-3J qualification on Java 21 and 25
        if: steps.portable-selection.outputs.mode == 'cp3f'
        run: |
          ./scripts/qualify-cp-3j.sh \
            --profile ci-h2 \
            --env /dev/null \
            --war-java21 app/target/cp3f-jakarta11/wildfly-migration.war \
            --war-java25 app/target/cp3j-java25/wildfly-migration.war
          ./scripts/validate-cp-3j-qualification.sh --profile ci-h2
          ./scripts/validate-cp-3j-closure.sh \
            --war-java21 app/target/cp3f-jakarta11/wildfly-migration.war \
            --war-java25 app/target/cp3j-java25/wildfly-migration.war

      - name: Upload CP-3F portable evidence
        if: steps.portable-selection.outputs.mode == 'cp3f'
        uses: actions/upload-artifact@v6
        with:
          name: cp-3f-portable-evidence
          path: |
            migration/evidence/CP-3F/jakarta-build.json
            migration/evidence/CP-3F/jakarta-build.txt
            migration/evidence/CP-3F/deployment-tiles-blocked.txt
            migration/evidence/CP-3G/upload-ci-h2.json
            migration/evidence/CP-3G/upload-oracle.json
            migration/evidence/CP-3G/discovery-ci-h2.json
            migration/evidence/CP-3G/logging-ci-h2.json
            migration/evidence/CP-3G/closure.properties
            migration/evidence/CP-3G/rollback.properties
            docs/evidence/CP-3G.md
            migration/evidence/CP-3H/xml-ci-h2.json
            migration/steps/CP-3H-xml-safe.md
            migration/evidence/CP-3H/datasource-ci-h2.json
            migration/evidence/CP-3H/datasource-oracle.json
            migration/steps/CP-3H-ojdbc17-datasource.md
            migration/steps/CP-3H-oracle-qualification.md
            migration/evidence/CP-3H/oracle-qualification.json
            migration/steps/CP-3H-final-packaging-audit.md
            migration/evidence/CP-3H/packaging-audit.json
            migration/steps/CP-3H-closure.md
            docs/evidence/CP-3H.md
            migration/evidence/CP-3H/closure-portable-ci.json
            migration/evidence/CP-3H/closure-oracle-qualified.json
            migration/evidence/CP-3H/closure.properties
            migration/evidence/CP-3H/rollback.properties
            migration/steps/CP-3I-persistence-semantics.md
            docs/evidence/CP-3I.md
            migration/evidence/CP-3I/persistence-ci-h2.json
            migration/evidence/CP-3I/persistence-oracle.json
            migration/steps/CP-3I-contract-comparison.md
            migration/evidence/CP-3I/contract-ci-h2.json
            migration/evidence/CP-3I/contract-oracle.json
            migration/steps/CP-3I-manifest.md
            migration/evidence/CP-3I/manifest.properties
            docs/cp-3d-reproduction.md
            migration/steps/CP-3I-closure.md
            migration/evidence/CP-3I/closure-portable-ci.json
            migration/evidence/CP-3I/closure-oracle-qualified.json
            migration/evidence/CP-3I/closure.properties
            migration/evidence/CP-3I/rollback.properties
            runtime/phase3/java25-wildfly41/README.md
            runtime/phase3/java25-wildfly41/runtime-manifest.tsv
            docs/evidence/CP-3J.md
            migration/evidence/CP-3J/runtime-selection.properties
            migration/evidence/CP-3J/java25-build-expected.properties
            migration/evidence/CP-3J/java25-build.json
            migration/evidence/CP-3J/java25-build.txt
            migration/evidence/CP-3J/ci-h2-qualification.json
            migration/evidence/CP-3J/ci-h2-java21-contracts.json
            migration/evidence/CP-3J/ci-h2-java25-contracts.json
            migration/evidence/CP-3J/ci-h2-java21-wildfly.log
            migration/evidence/CP-3J/ci-h2-java25-wildfly.log
            migration/evidence/CP-3J/closure.properties
            migration/evidence/CP-3J/rollback.properties
            migration/steps/CP-3J-closure.md
            runtime/phase3/java21-wildfly41/runtime-manifest.tsv
            app/target/contract-results/cp-3f-ci-h2.json
            app/target/contract-results/cp-3f-wildfly41.log
          if-no-files-found: error
          retention-days: 14

      - name: Run portable doctor
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        run: ./scripts/doctor.sh CP-3B --profile ci-h2 --ci

      - name: Build and audit portable WAR
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        run: ./scripts/build-cp-3b.sh --profile ci-h2

      - name: Compile Oracle probes without credentials
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        run: |
          ./scripts/validate-cp-2c-oracle-persistence.sh \
            --compile-only \
            --java 17 \
            --war app/target/wildfly-migration.war
          ./scripts/validate-cp-2d-oracle-state.sh \
            --compile-only \
            --java 17 \
            --war app/target/wildfly-migration.war

      - name: Execute MyBatis portable persistence probe
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        run: |
          ./scripts/validate-cp-1e-persistence.sh \
            --java-home "$JAVA17_HOME" \
            --h2-jar "$H2_JAR" \
            --war app/target/wildfly-migration.war \
            --result \
              app/target/contract-results/cp-3b-mybatis-ci-h2.json

      - name: Execute H2 schema lifecycle
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        run: |
          ./scripts/validate-cp-1d-h2.sh \
            --java-home "$JAVA17_HOME" \
            --h2-jar "$H2_JAR"

      - name: Smoke WildFly 26 H2 datasource
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        run: |
          ./scripts/smoke-cp-3b-datasource.sh \
            --profile ci-h2 \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-3b-ci-h2.json \
            --logging-result \
              app/target/contract-results/cp-3b-logging-ci-h2.json \
            --upload-result \
              app/target/contract-results/cp-3b-upload-ci-h2.json \
            --discovery-result \
              app/target/contract-results/cp-3b-discovery-ci-h2.json

      - name: Validate Java 17 and CP-3B dependencies
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        run: |
          ./scripts/validate-cp-3a.sh \
            --promoted-war app/target/wildfly-migration.war \
            --promoted-contract-result \
              app/target/contract-results/cp-3b-ci-h2.json
          ./scripts/validate-cp-3b.sh \
            --war app/target/wildfly-migration.war \
            --h2-result \
              app/target/contract-results/cp-3b-mybatis-ci-h2.json \
            --h2-contract app/target/contract-results/cp-3b-ci-h2.json \
            --h2-logging-result \
              app/target/contract-results/cp-3b-logging-ci-h2.json \
            --h2-upload-result \
              app/target/contract-results/cp-3b-upload-ci-h2.json \
            --h2-discovery-result \
              app/target/contract-results/cp-3b-discovery-ci-h2.json

      - name: Upload sanitized CP-3B portable evidence
        if: steps.portable-selection.outputs.run == 'true' && steps.portable-selection.outputs.mode != 'cp3f'
        uses: actions/upload-artifact@v6
        with:
          name: cp-3b-portable-evidence
          path: |
            app/target/contract-results/cp-3b-mybatis-ci-h2.json
            app/target/contract-results/cp-3b-ci-h2.json
            app/target/contract-results/cp-3b-logging-ci-h2.json
            app/target/contract-results/cp-3b-upload-ci-h2.json
            app/target/contract-results/cp-3b-discovery-ci-h2.json
            app/target/dependency-tree.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save reusable runtime archive cache
        if: >-
          success() &&
          steps.portable-selection.outputs.run == 'true' &&
          steps.runtime-archive-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name ==
             github.repository)
          )
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/wildfly-migration-cache/runtime-archives
          key: ${{ steps.runtime-archive-cache.outputs.cache-primary-key }}

      - name: Save reusable Maven dependency cache
        if: >-
          success() &&
          steps.portable-selection.outputs.run == 'true' &&
          steps.maven-dependency-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name ==
             github.repository)
          )
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-dependency-cache.outputs.cache-primary-key }}
