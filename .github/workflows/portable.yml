name: portable-ci

on:
  pull_request:
    paths:
      - ".env.example"
      - ".github/workflows/portable.yml"
      - "app/**"
      - "contract-tests/**"
      - "migration/baselines/**"
      - "runtime/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - ".github/workflows/portable.yml"
      - "app/**"
      - "contract-tests/**"
      - "migration/baselines/**"
      - "runtime/**"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-ci:
    name: portable-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore fixed runtime archive cache
        id: runtime-archive-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/wildfly-migration-cache/cp-2b/runtime-archives
          key: cp-2b-runtime-archives-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/legacy/runtime-manifest.tsv', 'runtime/legacy/portable-runtime-manifest.tsv', 'runtime/phase2/java8-wildfly26/runtime-manifest.tsv') }}

      - name: Restore exact Maven dependency cache
        id: maven-dependency-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: cp-2b-maven-repository-v1-${{ runner.os }}-${{ runner.arch }}-maven-3.8.9-${{ hashFiles('app/pom.xml') }}

      - name: Download and verify fixed portable runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/wildfly-migration-cp2b"
          archives="$RUNNER_TEMP/wildfly-migration-cache/cp-2b/runtime-archives"
          tools="$runtime_root/tools"
          install -d -m 0755 "$archives" "$tools"

          ensure_archive() {
            local expected_sha256="$1"
            local archive_name="$2"
            local archive_path="$archives/$archive_name"
            local partial_path="${archive_path}.part"
            local origin
            shift 2

            if [[ -f "$archive_path" ]] &&
               printf '%s  %s\n' "$expected_sha256" "$archive_path" |
                 sha256sum --check --status; then
              printf 'Cache validado por SHA-256: %s\n' "$archive_name"
              return
            fi

            rm -f -- "$partial_path"
            for origin in "$@"; do
              printf 'Baixando da origem registrada: %s\n' "$archive_name"
              printf 'Origem: %s\n' "$origin"
              if curl --retry 3 --retry-all-errors \
                  -fsSLo "$partial_path" "$origin" &&
                 printf '%s  %s\n' "$expected_sha256" "$partial_path" |
                   sha256sum --check --status; then
                mv -f -- "$partial_path" "$archive_path"
                printf 'Download validado por SHA-256: %s\n' "$archive_name"
                return
              fi
              printf 'Origem indisponível ou conteúdo inválido: %s\n' \
                "$origin" >&2
              rm -f -- "$partial_path"
            done

            printf 'FALHA: nenhuma origem produziu o arquivo aprovado: %s\n' \
              "$archive_name" >&2
            return 1
          }

          ensure_archive \
            da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e \
            OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz \
            https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u492-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz
          ensure_archive \
            3e4c68cdd70f96635e713f36c8fc3ea3182035245d3da2156576710ca0fe4b0c \
            apache-maven-3.8.9-bin.tar.gz \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.8.9/apache-maven-3.8.9-bin.tar.gz \
            https://archive.apache.org/dist/maven/maven-3/3.8.9/binaries/apache-maven-3.8.9-bin.tar.gz
          ensure_archive \
            aadd317c62616f6b5735ae92151d06c1f03c46eba448958d982c61f02528ae59 \
            wildfly-26.1.3.Final.tar.gz \
            https://github.com/wildfly/wildfly/releases/download/26.1.3.Final/wildfly-26.1.3.Final.tar.gz
          ensure_archive \
            3ad9ac4b6aae9cd9d3ac1c447465e1ed06019b851b893dd6a8d76ddb6d85bca6 \
            h2-1.4.200.jar \
            https://repo.maven.apache.org/maven2/com/h2database/h2/1.4.200/h2-1.4.200.jar

          cd "$archives"
          sha256sum --check <<'CHECKSUMS'
          da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e  OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz
          3e4c68cdd70f96635e713f36c8fc3ea3182035245d3da2156576710ca0fe4b0c  apache-maven-3.8.9-bin.tar.gz
          aadd317c62616f6b5735ae92151d06c1f03c46eba448958d982c61f02528ae59  wildfly-26.1.3.Final.tar.gz
          3ad9ac4b6aae9cd9d3ac1c447465e1ed06019b851b893dd6a8d76ddb6d85bca6  h2-1.4.200.jar
          CHECKSUMS

          tar -xzf OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz -C "$tools"
          tar -xzf apache-maven-3.8.9-bin.tar.gz -C "$tools"
          tar -xzf wildfly-26.1.3.Final.tar.gz -C "$tools"

          {
            echo "MIGRATION_CHECKPOINT=CP-2B"
            echo "LAB_BIND_ADDRESS=127.0.0.1"
            echo "WILDFLY_HTTP_PORT=18080"
            echo "WILDFLY_MANAGEMENT_PORT=19990"
            echo "JAVA8_HOME=$tools/jdk8u492-b09"
            echo "JAVA8_ARCHIVE=$archives/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz"
            echo "JAVA8_ARCHIVE_SHA256=da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e"
            echo "MAVEN_HOME=$tools/apache-maven-3.8.9"
            echo "MAVEN_ARCHIVE=$archives/apache-maven-3.8.9-bin.tar.gz"
            echo "MAVEN_ARCHIVE_SHA256=3e4c68cdd70f96635e713f36c8fc3ea3182035245d3da2156576710ca0fe4b0c"
            echo "WILDFLY26_HOME=$tools/wildfly-26.1.3.Final"
            echo "WILDFLY26_ARCHIVE=$archives/wildfly-26.1.3.Final.tar.gz"
            echo "WILDFLY26_ARCHIVE_SHA256=aadd317c62616f6b5735ae92151d06c1f03c46eba448958d982c61f02528ae59"
            echo "H2_JAR=$archives/h2-1.4.200.jar"
            echo "H2_SHA256=3ad9ac4b6aae9cd9d3ac1c447465e1ed06019b851b893dd6a8d76ddb6d85bca6"
          } >> "$GITHUB_ENV"

      - name: Run portable doctor
        run: ./scripts/doctor.sh CP-2B --profile ci-h2 --ci

      - name: Build and audit portable WAR
        run: ./scripts/build-cp-2a.sh --profile ci-h2

      - name: Execute MyBatis portable persistence probe
        run: |
          ./scripts/validate-cp-1e-persistence.sh \
            --java-home "$JAVA8_HOME" \
            --h2-jar "$H2_JAR"

      - name: Execute H2 schema lifecycle
        run: |
          ./scripts/validate-cp-1d-h2.sh \
            --java-home "$JAVA8_HOME" \
            --h2-jar "$H2_JAR"

      - name: Smoke WildFly 26 H2 datasource
        run: |
          ./scripts/smoke-wildfly26-datasource.sh \
            --profile ci-h2 \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-2b-ci-h2.json

      - name: Compare portable result with the frozen baseline
        run: |
          ./scripts/validate-cp-2b.sh \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-2b-ci-h2.json

      - name: Upload sanitized portable contract result
        uses: actions/upload-artifact@v6
        with:
          name: cp-2b-portable-contract-result
          path: app/target/contract-results/cp-2b-ci-h2.json
          if-no-files-found: error
