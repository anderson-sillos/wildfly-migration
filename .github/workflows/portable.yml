name: portable-ci

on:
  pull_request:
    paths:
      - ".env.example"
      - ".github/workflows/pr-cache-cleanup.yml"
      - ".github/workflows/portable.yml"
      - "app/**"
      - "contract-tests/**"
      - "migration/baselines/**"
      - "runtime/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - ".github/workflows/pr-cache-cleanup.yml"
      - ".github/workflows/portable.yml"
      - "app/**"
      - "contract-tests/**"
      - "migration/baselines/**"
      - "runtime/**"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-ci:
    name: portable-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATION_SOURCE_COMMIT: >-
        ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore reusable runtime archive cache
        id: runtime-archive-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/wildfly-migration-cache/runtime-archives
          key: runtime-archives-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/portable-runtime-cache.sha256') }}
          restore-keys: |
            runtime-archives-v4-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore reusable Maven dependency cache
        id: maven-dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: maven-repository-v3-${{ runner.os }}-${{ runner.arch }}-maven-3.9.16-${{ hashFiles('app/pom.xml') }}
          restore-keys: |
            maven-repository-v3-${{ runner.os }}-${{ runner.arch }}-maven-3.9.16-

      - name: Download and verify fixed portable runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/wildfly-migration-cp2d"
          archives="$RUNNER_TEMP/wildfly-migration-cache/runtime-archives"
          cache_lock="$GITHUB_WORKSPACE/runtime/portable-runtime-cache.sha256"
          tools="$runtime_root/tools"
          install -d -m 0755 "$archives" "$tools"

          while IFS= read -r -d '' cached_path; do
            cached_name="${cached_path##*/}"
            if ! awk '{print $2}' "$cache_lock" |
                grep -Fxq "$cached_name"; then
              printf 'Removendo arquivo obsoleto do cache restaurado: %s\n' \
                "$cached_name"
              rm -f -- "$cached_path"
            fi
          done < <(find "$archives" -mindepth 1 -maxdepth 1 -type f -print0)

          ensure_archive() {
            local expected_sha256="$1"
            local archive_name="$2"
            local archive_path="$archives/$archive_name"
            local partial_path="${archive_path}.part"
            local origin
            shift 2

            if [[ -f "$archive_path" ]] &&
               printf '%s  %s\n' "$expected_sha256" "$archive_path" |
                 sha256sum --check --status; then
              printf 'Cache validado por SHA-256: %s\n' "$archive_name"
              return
            fi

            rm -f -- "$partial_path"
            for origin in "$@"; do
              printf 'Baixando da origem registrada: %s\n' "$archive_name"
              printf 'Origem: %s\n' "$origin"
              if curl --retry 3 --retry-all-errors \
                  -fsSLo "$partial_path" "$origin" &&
                 printf '%s  %s\n' "$expected_sha256" "$partial_path" |
                   sha256sum --check --status; then
                mv -f -- "$partial_path" "$archive_path"
                printf 'Download validado por SHA-256: %s\n' "$archive_name"
                return
              fi
              printf 'Origem indisponível ou conteúdo inválido: %s\n' \
                "$origin" >&2
              rm -f -- "$partial_path"
            done

            printf 'FALHA: nenhuma origem produziu o arquivo aprovado: %s\n' \
              "$archive_name" >&2
            return 1
          }

          ensure_archive \
            da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e \
            OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz \
            https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u492-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz
          ensure_archive \
            80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb \
            apache-maven-3.9.16-bin.tar.gz \
            https://downloads.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          ensure_archive \
            aadd317c62616f6b5735ae92151d06c1f03c46eba448958d982c61f02528ae59 \
            wildfly-26.1.3.Final.tar.gz \
            https://github.com/wildfly/wildfly/releases/download/26.1.3.Final/wildfly-26.1.3.Final.tar.gz
          ensure_archive \
            3ad9ac4b6aae9cd9d3ac1c447465e1ed06019b851b893dd6a8d76ddb6d85bca6 \
            h2-1.4.200.jar \
            https://repo.maven.apache.org/maven2/com/h2database/h2/1.4.200/h2-1.4.200.jar

          (
            cd "$archives"
            sha256sum --check "$cache_lock"
          )

          cd "$archives"

          tar -xzf OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz -C "$tools"
          tar -xzf apache-maven-3.9.16-bin.tar.gz -C "$tools"
          tar -xzf wildfly-26.1.3.Final.tar.gz -C "$tools"

          {
            echo "MIGRATION_CHECKPOINT=CP-2D"
            echo "LAB_BIND_ADDRESS=127.0.0.1"
            echo "WILDFLY_HTTP_PORT=18080"
            echo "WILDFLY_MANAGEMENT_PORT=19990"
            echo "JAVA8_HOME=$tools/jdk8u492-b09"
            echo "JAVA8_ARCHIVE=$archives/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz"
            echo "JAVA8_ARCHIVE_SHA256=da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e"
            echo "MAVEN_HOME=$tools/apache-maven-3.9.16"
            echo "MAVEN_ARCHIVE=$archives/apache-maven-3.9.16-bin.tar.gz"
            echo "MAVEN_ARCHIVE_SHA256=80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb"
            echo "WILDFLY26_HOME=$tools/wildfly-26.1.3.Final"
            echo "WILDFLY26_ARCHIVE=$archives/wildfly-26.1.3.Final.tar.gz"
            echo "WILDFLY26_ARCHIVE_SHA256=aadd317c62616f6b5735ae92151d06c1f03c46eba448958d982c61f02528ae59"
            echo "H2_JAR=$archives/h2-1.4.200.jar"
            echo "H2_SHA256=3ad9ac4b6aae9cd9d3ac1c447465e1ed06019b851b893dd6a8d76ddb6d85bca6"
          } >> "$GITHUB_ENV"

      - name: Run portable doctor
        run: ./scripts/doctor.sh CP-2D --profile ci-h2 --ci

      - name: Build and audit portable WAR
        run: ./scripts/build-cp-2c.sh --profile ci-h2

      - name: Compile Oracle probes without credentials
        run: |
          ./scripts/validate-cp-2c-oracle-persistence.sh \
            --compile-only \
            --war app/target/wildfly-migration.war
          ./scripts/validate-cp-2d-oracle-state.sh \
            --compile-only \
            --war app/target/wildfly-migration.war

      - name: Execute MyBatis portable persistence probe
        run: |
          ./scripts/validate-cp-1e-persistence.sh \
            --java-home "$JAVA8_HOME" \
            --h2-jar "$H2_JAR"

      - name: Execute H2 schema lifecycle
        run: |
          ./scripts/validate-cp-1d-h2.sh \
            --java-home "$JAVA8_HOME" \
            --h2-jar "$H2_JAR"

      - name: Smoke WildFly 26 H2 datasource
        run: |
          ./scripts/smoke-wildfly26-datasource.sh \
            --profile ci-h2 \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-2d-ci-h2.json

      - name: Compare portable phase 2 result with the frozen baseline
        run: |
          ./scripts/validate-cp-2c.sh \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-2d-ci-h2.json
          ./scripts/validate-cp-2d-phase-comparison.sh \
            --war app/target/wildfly-migration.war \
            --contract-result app/target/contract-results/cp-2d-ci-h2.json
          ./scripts/validate-cp-2d-manifest.sh \
            --war app/target/wildfly-migration.war

      - name: Upload sanitized portable phase 2 evidence
        uses: actions/upload-artifact@v6
        with:
          name: cp-2d-portable-evidence
          path: |
            app/target/contract-results/cp-2d-ci-h2.json
            app/target/dependency-tree.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save reusable runtime archive cache
        if: >-
          success() &&
          steps.runtime-archive-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name ==
             github.repository)
          )
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/wildfly-migration-cache/runtime-archives
          key: ${{ steps.runtime-archive-cache.outputs.cache-primary-key }}

      - name: Save reusable Maven dependency cache
        if: >-
          success() &&
          steps.maven-dependency-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name ==
             github.repository)
          )
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-dependency-cache.outputs.cache-primary-key }}
